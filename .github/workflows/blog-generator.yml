name: Daily Blog Post Generator

on:
  # The script itself enforces the cadence (one post every 2 days), so a daily
  # check is enough. cron-job.org also triggers workflow_dispatch; extra runs
  # just exit early.
  schedule:
    - cron: "0 7 * * *"    # 8am Portugal
  workflow_dispatch:
    inputs:
      force:
        description: "Write a post now, even if one went out in the last 2 days"
        type: boolean
        default: false

concurrency:
  group: blog-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "Bodystrands Blog Bot"
          git config user.email "storenavaria@gmail.com"

      - name: Sync with latest main
        run: git pull origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: node scripts/generate-blog-post.mjs

      - name: Commit and push
        run: |
          git add data/blog-posts.json
          if git diff --staged --quiet; then
            echo "No new post generated, skipping."
            exit 0
          fi
          # No [skip ci]: the post has to trigger the Vercel/Cloudflare deploys to go live.
          # (With [skip ci], posts only went live when some other change happened to be pushed.)
          git commit -m "Add blog post"
          git push || (git pull --rebase origin main && git push)
